name: Build
on:
  push:
    paths-ignore: ['README.md', 'store/**']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Keystore (optional, nur wenn Secret vorhanden)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: Bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --build-cache --parallel
      - name: Dateien umbenennen
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/Homöopathie.apk
          cp app/build/outputs/bundle/release/*.aab out/Homöopathie.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Homöopathie
          path: |
            out/Homöopathie.apk
            out/Homöopathie.aab
